<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E&amp;TC Notes Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="RGPV Diploma E&TC notes in Hindi with diagrams, derivations and PDF download.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martel:wght@700;800&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

/* Layout: control panel (sticky) beside an exam answer-sheet with a red margin, on faint graph paper */
:root{
  --bg:#eef1f5; --paper:#fbfcfd; --grid:#e8edf4; --ink:#172033; --muted:#5b667a;
  --line:#d3dbe6; --accent:#1f4fb8; --accent-ink:#ffffff; --soft:#e5ecfa; --red:#c0392b;
  --code:#f1f4f8;
  --f-display:"Martel","Noto Serif Devanagari",Georgia,serif;
  --f-body:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --paper:#141b26; --grid:#19212e; --ink:#e2e8f2; --muted:#94a1b5;
  --line:#2a3546; --accent:#86a9ff; --accent-ink:#0b1220; --soft:#1c2740; --red:#ff7f70;
  --code:#1a2230; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131b; --paper:#141b26; --grid:#19212e; --ink:#e2e8f2; --muted:#94a1b5;
  --line:#2a3546; --accent:#86a9ff; --accent-ink:#0b1220; --soft:#1c2740; --red:#ff7f70;
  --code:#1a2230; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.65rem;line-height:1.2;margin:0;text-wrap:balance}
.brand span{color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.layout{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
@media (min-width:920px){.layout{grid-template-columns:340px minmax(0,1fr)} .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}

/* panel */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:8px;padding:4px;gap:4px}
.tabs button{font:600 .95rem var(--f-body);border:0;border-radius:6px;padding:8px 6px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl b{font-family:var(--f-body);font-size:.85rem;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink)}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .9rem var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.num{font-family:var(--f-mono);font-size:.85rem;min-width:42px}
.chip.sug{font-size:.82rem;padding:3px 10px;color:var(--muted)}
.chip.sug:hover{color:var(--ink);border-color:var(--accent)}
.scheme{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.scheme .w{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);font-variant-numeric:tabular-nums}
.go{font:700 1rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 14px;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:.82rem;color:var(--muted);margin:0}

/* output */
.out{display:flex;flex-direction:column;gap:10px;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.status{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--accent);animation:pulse 1s infinite}
.status.done .dot{background:#2e9e5b}
.status.err .dot{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status.live .dot{animation:none}}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:500 .88rem var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:5px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}

.sheet{display:grid;grid-template-columns:58px minmax(0,1fr);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;border:1px solid var(--line);border-radius:4px;min-height:420px}
.margin{border-right:2px solid var(--red);padding:22px 6px;text-align:center;font-family:var(--f-mono);font-size:.82rem;color:var(--red);display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.page{padding:22px clamp(14px,3vw,36px) 32px;min-width:0}
.qhead{border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:4px}
.qhead .meta{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qhead h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;line-height:1.5;margin:0;text-wrap:balance}
.qhead .ex{align-self:flex-start;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--accent);border-radius:4px;padding:2px 8px}

.md{font-size:1.06rem;line-height:1.8;max-width:72ch;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md h1,.md h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;line-height:1.5;margin:1.6em 0 .4em;text-wrap:balance}
.md h3{font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin:1.3em 0 .3em}
.md h4{font-size:1.02rem;margin:1em 0 .2em}
.md p{margin:.55em 0}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md li{margin:.2em 0}
.md strong{font-weight:700}
.md blockquote{margin:.8em 0;padding:.4em 1em;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 6px 6px 0}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--code);padding:1px 5px;border-radius:4px}
.md pre{background:var(--code);border:1px solid var(--line);border-radius:7px;padding:12px;overflow-x:auto;line-height:1.5}
.md pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:.8em 0}
.md table{border-collapse:collapse;font-size:.95rem;background:var(--paper)}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--soft);font-weight:600}
.eq{display:block;overflow-x:auto;overflow-y:hidden;margin:.6em 0;padding:2px 0}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.fig{margin:1em 0 .2em;overflow-x:auto;color:var(--ink);text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
.fig svg{width:100%;max-width:620px;height:auto;display:inline-block;font-family:var(--f-body)}
.fig svg .hl{stroke:var(--red)}
@media (max-width:600px){.fig{padding:8px}.fig-blocks svg{min-width:600px;max-width:none}.fig-plot svg{max-width:none}}
.fig svg text.hl,.fig svg [fill="currentColor"].hl,.fig svg .hl [fill="currentColor"]{fill:var(--red)}
.fig svg .hl text{fill:var(--ink)}
.fig svg .term{fill:var(--paper)}
.fig svg .grid{stroke:var(--muted);opacity:.5}
.fig + p:has(> em:only-child){text-align:center;color:var(--muted);font-size:.92rem;margin-top:.3em}
.btn-pdf{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-pdf:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:progress}
.pdfdoc{--bg:#ffffff;--paper:#ffffff;--grid:#ffffff;--ink:#172033;--muted:#5b667a;--line:#d3dbe6;--soft:#eef2fb;--red:#c0392b;--code:#f3f5f8;--accent:#1f4fb8;--accent-ink:#ffffff;
  width:100%;background:#ffffff;color:#172033;font-family:var(--f-body);font-size:16px;line-height:1.7}
.pdfdoc .pdf-head{border-bottom:2px solid #1f4fb8;padding-bottom:10px;margin-bottom:18px}
.pdfdoc .pdf-meta{font-family:var(--f-body);font-size:12px;font-weight:600;color:#5b667a}
.pdfdoc .pdf-title{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.55;margin-top:4px}
.pdfdoc .md{max-width:none;font-size:16px;line-height:1.75}
.pdfdoc .fig{border:1px solid #d3dbe6;background:#ffffff;color:#172033;overflow:visible}
.pdfdoc .eq,.pdfdoc .tbl,.pdfdoc pre{overflow:visible}
.pdfdoc mjx-container{color:#172033}
.pdfdoc .pdf-end{margin-top:24px;padding-top:8px;border-top:1px solid #d3dbe6;font-size:12px;color:#5b667a}
.fig-warn{margin:-.1em 0 .6em;font-size:.85rem;color:var(--red);text-align:center}
.pending{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);font-size:.92rem;margin:1em 0}
.thinking{color:var(--muted);display:flex;flex-direction:column;gap:6px;padding:20px 0}
.thinking b{color:var(--ink);font-weight:600}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.wc{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wc.ok{color:#2e9e5b}
.note{margin-top:14px;padding:8px 12px;border-radius:6px;background:var(--soft);font-size:.9rem}
.note.err{background:transparent;border:1px solid var(--red);color:var(--red)}

@media (max-width:520px){.sheet{grid-template-columns:40px minmax(0,1fr)} .margin{font-size:.72rem;padding:18px 2px} .brand{font-size:1.4rem} .md{font-size:1.02rem}}

/* ---------- library ---------- */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
.lib-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.lib-top a{color:inherit;text-decoration:none}
.lib-top .sub{font-size:.9rem;color:var(--muted);margin-top:2px}
.stat{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.view{display:flex;flex-direction:column;gap:18px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#search{flex:1 1 280px;font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 14px}
#search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.semtabs{display:flex;gap:6px;flex-wrap:wrap}
.semtab{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.semtab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;min-width:0}
.subj:hover{border-color:var(--accent)}
.subj:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.subj .code{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;color:var(--muted)}
.subj .sname{font-family:var(--f-display);font-weight:800;font-size:1.08rem;line-height:1.45;text-wrap:balance}
.subj .elect{font-size:.8rem;color:var(--accent)}
.subj.soon .sname{color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:4px;margin-top:auto;padding-top:6px}
.bar{height:5px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar span{display:block;height:100%;background:#2e9e5b}
.pnum{font-size:.8rem;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:8px}
.hit{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}
.hit:hover{border-color:var(--accent)}
.hit .hs{grid-column:1;font-size:.78rem;color:var(--muted)}
.hit .ht{grid-column:1;font-weight:600}
.hit .chip{grid-column:2;grid-row:1 / span 2}
.hit.na .ht{color:var(--muted)}
.empty{color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.chip.ok{border-color:#2e9e5b;color:#2e9e5b}
.crumb{font-size:.88rem;color:var(--muted)}
.crumb a{color:var(--accent);text-decoration:none}
.crumb span{margin:0 4px}
.stitle{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.4;margin:0;text-wrap:balance}
.smeta{color:var(--muted);font-size:.9rem;margin:-10px 0 0}
.units{display:flex;flex-direction:column;gap:14px}
.unit{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.uhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.uhead .un{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.uhead h3{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:2px 0 0}
.uright{display:flex;gap:10px;align-items:center}
.marks{font-family:var(--f-mono);font-size:.78rem;color:var(--red);font-variant-numeric:tabular-nums}
.tlist{list-style:none;margin:0;padding:0}
.tlist li + li{border-top:1px solid var(--line)}
.tlist a,.tlist .na{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 16px;color:inherit;text-decoration:none}
.tlist a:hover{background:var(--soft)}
.tlist a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{display:flex;flex-direction:column;min-width:0}
.te{font-weight:600;line-height:1.4}
.th{font-size:.88rem;color:var(--muted)}
.na .te{color:var(--muted);font-weight:500}
.tbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.qhead .hsub{font-size:1rem;color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pg{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:inherit;text-decoration:none;min-width:0}
.pg:hover{border-color:var(--accent)}
.pg span{font-size:.8rem;color:var(--accent);font-weight:600}
.pg b{font-weight:600;font-size:.92rem;line-height:1.4}
.pg.nx{text-align:right}
.lib-foot{border-top:1px solid var(--line);padding-top:12px;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.lib-foot a{color:var(--accent)}
.tact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{font:600 .84rem var(--f-body);border:0;background:transparent;color:var(--muted);padding:5px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button + button{border-left:1px solid var(--line)}
.seg button small{font-weight:500;font-size:.7rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.segrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seglbl{font-size:.85rem;color:var(--muted)}
.deep{border-left:3px solid var(--accent);background:var(--soft);padding:2px 16px 10px;margin:1.4em 0;border-radius:0 8px 8px 0}
.deep::before{content:"In-depth · विस्तृत अध्ययन";display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;color:var(--accent);margin:12px 0 0}
.qa-tools{display:flex;justify-content:flex-end;margin:.4em 0}
details.qa{border:1px solid var(--line);border-radius:8px;background:var(--paper);margin:.55em 0}
details.qa > summary{cursor:pointer;list-style:none;padding:10px 14px;display:flex;gap:10px;align-items:baseline;font-weight:600;line-height:1.55}
details.qa > summary::-webkit-details-marker{display:none}
details.qa > summary::before{content:"▸";color:var(--accent);flex:none}
details.qa[open] > summary::before{content:"▾"}
details.qa > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
details.qa[open]{padding-bottom:8px}
details.qa[open] > summary{border-bottom:1px dashed var(--line);margin-bottom:6px}
details.qa > :not(summary){margin-left:16px;margin-right:16px}
.qbadge{font-family:var(--f-mono);font-size:.66rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;color:#2e9e5b;flex:none}
.qa-long .qbadge{color:var(--red)}
.qtext{min-width:0}
.pdfdoc .pdf-hsub{font-size:15px;color:#5b667a;margin-top:2px}
@media (max-width:520px){.tlist a,.tlist .na{grid-template-columns:36px 1fr;}.tlist .chip{grid-column:2;justify-self:start}.pager{grid-template-columns:1fr}.pg.nx{text-align:left}}
</style>
</head>
<body>


<div class="wrap">
  <header class="lib-top">
    <a href="#home"><h1 class="brand">E&amp;TC <span>हिंदी नोट्स</span></h1><div class="sub">RGPV Diploma Wing · Electronics &amp; Telecommunication · Session 2025-26</div></a>
    <div class="stat" id="stat"></div>
  </header>

  <section class="view" id="v-home">
    <div class="searchrow"><input type="search" id="search" placeholder="Search a topic, e.g. rectifier, zener, flip-flop" autocomplete="off" aria-label="Search topics"></div>
    <div class="semtabs" id="semtabs"></div>
    <div class="results" id="results" hidden></div>
    <div class="subjects" id="subjects"></div>
    <div class="msgbox"></div>
  </section>

  <section class="view" id="v-subject" hidden>
    <div class="crumb" id="s-crumb"></div>
    <h2 class="stitle" id="s-title"></h2>
    <p class="smeta" id="s-meta"></p>
    <div class="segrow"><span class="seglbl">Note length for reading and Unit PDF</span><div class="seg" id="s-seg" data-seg role="group" aria-label="Note length"></div></div>
    <div class="msgbox"></div>
    <div class="units" id="units"></div>
  </section>

  <section class="view" id="v-topic" hidden>
    <div class="tbar"><div class="crumb" id="t-crumb"></div><div class="tact"><div class="seg" id="t-seg" data-seg role="group" aria-label="Note length"></div><button class="btn btn-pdf" id="pdfbtn" type="button">Download PDF</button></div></div>
    <div class="msgbox"></div>
    <article class="sheet" id="sheet">
      <div class="margin" id="margin"></div>
      <div class="page">
        <div class="qhead" id="qhead"></div>
        <div class="md" id="md"></div>

/* ---------- expand, snap, check ---------- */
function prepare(spec){
  let els, fromTemplate = false;
  if(spec && spec.template){
    const k = String(spec.template).toLowerCase().replace(/[\s-]/g,"_");
    if(!TEMPLATES[k]) throw new Error("unknown template");
    els = TEMPLATES[k](spec); fromTemplate = true;
    if(spec.labels && typeof spec.labels === "object") els.forEach(e => { if(e.label && spec.labels[e.label] != null) e.label = String(spec.labels[e.label]); if(e.text && spec.labels[e.text] != null) e.text = String(spec.labels[e.text]); });
  } else els = Array.isArray(spec) ? spec : ((spec && (spec.elements || spec.parts)) || []);
  els = els.filter(e => e && typeof e === "object").map(e => ({ ...e, _t: normType(e) }));
  // normalise wires to {path}
  els.forEach(e => { if(e._t === "wire"){ const p = e.path || e.points || [e.from, e.to]; try{ e.path = p.map(gp); }catch(err){ e._bad = true; } } });
  els = els.filter(e => !e._bad);
  // snap near-miss wire ends onto pins
  const pins = [];
  els.forEach(e => { if(e._t !== "wire"){ try{ pinsOf(e).forEach(p => pins.push(p)); }catch(err){} } });
  els.forEach(e => { if(e._t !== "wire") return; [0, e.path.length-1].forEach(i => {
    const p = e.path[i]; let best = null, bd = 0.36;
    pins.forEach(q => { const d = Math.hypot(p[0]-q[0], p[1]-q[1]); if(d > EPS && d < bd){ bd = d; best = q; } });
    if(best){ const nb = e.path.length > 2 ? e.path[i === 0 ? 1 : e.path.length-2] : null; if(nb && (Math.abs(nb[0]-p[0]) < EPS)) nb[0] = best[0]; else if(nb && Math.abs(nb[1]-p[1]) < EPS) nb[1] = best[1]; e.path[i] = [best[0], best[1]]; }
  }); });
  return { els, fromTemplate };
}

function connections(els){
  const pins = [], ends = [], verts = [], segs = [];
  els.forEach((e, idx) => {
    if(e._t === "wire"){
      e.path.forEach((p, i) => { (i === 0 || i === e.path.length-1 ? ends : verts).push({ p, idx }); if(i) segs.push({ a:e.path[i-1], b:p, idx }); });
    } else { try{ pinsOf(e).forEach(p => pins.push({ p, idx, rail: RAILS.includes(e._t) || e._t === "terminal" })); }catch(err){} }
  });
  return { pins, ends, verts, segs };
}

function check(els){
  const issues = [];
  const { pins, ends, verts, segs } = connections(els);
  const touches = (p, idx) => pins.some(q => q.idx !== idx && same(q.p, p)) || ends.some(q => q.idx !== idx && same(q.p, p)) ||
    verts.some(q => q.idx !== idx && same(q.p, p)) || segs.some(s => s.idx !== idx && onInterior(p, s.a, s.b));
  const fmt = p => `[${+p[0].toFixed(2)},${+p[1].toFixed(2)}]`;
  els.forEach((e, idx) => {
    const t = e._t;
    if(t === "wire"){
      e.path.forEach((p, i) => { if(i && Math.abs(p[0]-e.path[i-1][0]) > EPS && Math.abs(p[1]-e.path[i-1][1]) > EPS) issues.push(`wire segment ${fmt(e.path[i-1])}→${fmt(p)} is diagonal; use horizontal and vertical segments`); });
      [e.path[0], e.path[e.path.length-1]].forEach(p => { if(!touches(p, idx)) issues.push(`wire end ${fmt(p)} is not connected to any part pin or wire`); });
    } else if(t !== "ic"){
      let ps = []; try{ ps = pinsOf(e); }catch(err){ issues.push(`${t} has invalid coordinates`); }
      ps.forEach(p => { if(!touches(p, idx)) issues.push(`${nameOf(e)} pin ${fmt(p)} is not connected`); });
    }
    if(BODY[t]){
      const a = gp(e.from), b = gp(e.to);
      segs.forEach(s => { if(s.idx === idx) return;
        const hit = segCross(a, b, s.a, s.b);
        if(hit && onInterior(hit.p, a, b)) issues.push(`a wire touches the middle of ${nameOf(e)} at ${fmt(hit.p)}; wires may connect only to its ends ${fmt(a)} and ${fmt(b)}`);
        else if(!hit && (onInterior(s.a, a, b) || onInterior(s.b, a, b))) issues.push(`a wire runs along the body of ${nameOf(e)}`);
      });
      pins.forEach(q => { if(q.idx !== idx && onInterior(q.p, a, b)) issues.push(`a pin of ${nameOf(els[q.idx])} sits in the middle of ${nameOf(e)} at ${fmt(q.p)}`); });
    }
    const box = boxOf(e);
    if(box) segs.forEach(s => { for(let k = 1; k < 20; k++){ const x = s.a[0]+(s.b[0]-s.a[0])*k/20, y = s.a[1]+(s.b[1]-s.a[1])*k/20;
      if(x > box[0]+EPS && x < box[2]-EPS && y > box[1]+EPS && y < box[3]-EPS){ issues.push(`a wire passes through the ${t} symbol at ${fmt([x,y])}`); break; } } });
  });
  return [...new Set(issues)];
}

function autoDots(els){
  const { pins, ends, verts, segs } = connections(els);
  const cand = [...pins.filter(q=>!q.rail), ...ends, ...verts].map(q => q.p);
  const uniq = []; cand.forEach(p => { if(!uniq.some(q => same(p,q))) uniq.push(p); });
  const dots = [];
  uniq.forEach(p => {
    let n = 0;
    pins.forEach(q => { if(!q.rail && same(q.p,p)) n += 1; });
    ends.forEach(q => { if(same(q.p,p)) n += 1; });
    verts.forEach(q => { if(same(q.p,p)) n += 2; });
    segs.forEach(s => { if(onInterior(p, s.a, s.b)) n += 2; });
    if(n >= 3) dots.push(p);
  });
  return dots;
}

/* ---------- draw ---------- */
function drawCircuit(spec){
  const { els } = prepare(spec);
  const dots = autoDots(els);
  const parts = []; let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  const ext = (x,y) => { minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); };
  const P = p => { const [x,y] = gp(p); return [x*G, y*G]; };
  for(const e of els){
    try{
      const t = e._t; let g = "", lab = "";
      if(t === "wire"){
        const pts = e.path.map(p => [p[0]*G, p[1]*G]);
        g = `<path d="M${pts.map(p=>f1(p[0])+" "+f1(p[1])).join(" L")}"/>`; pts.forEach(p=>ext(...p));
      } else if(BODY[t] || t === "arrow"){
        const [x1,y1] = P(e.from), [x2,y2] = P(e.to);
        const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy); if(L < 1) throw new Error("len");
        const ux=dx/L, uy=dy/L, mx=(x1+x2)/2, my=(y1+y2)/2;
        ext(x1,y1); ext(x2,y2);
        if(t === "arrow"){
          const sx = x1+ux*6, sy = y1+uy*6, ex = x2-ux*6, ey = y2-uy*6;
          g = `<path d="M${f1(sx)} ${f1(sy)} L${f1(ex-ux*6)} ${f1(ey-uy*6)}" stroke-width="1.6"/>` + head(ex,ey,ux,uy,9);
          if(e.label){ const s = sidePt(mx,my,ux,uy,14,e.flip); lab = T(s.x,s.y,e.label,s.anchor); ext(s.x,s.y); }
        } else {
          const [hw, body] = BODY[t];
          const ang = Math.atan2(dy,dx)*180/Math.PI;
          g = `<path d="M${f1(x1)} ${f1(y1)} L${f1(mx-ux*hw)} ${f1(my-uy*hw)} M${f1(mx+ux*hw)} ${f1(my+uy*hw)} L${f1(x2)} ${f1(y2)}"/>`;
          g += `<g transform="translate(${f1(mx)} ${f1(my)}) rotate(${f1(ang)})">${body}</g>`;
          if(t === "ac") g += `<path transform="translate(${f1(mx)} ${f1(my)})" d="M-8 0 q4 -9 8 0 t8 0"/>`;
          if(t === "vsrc") lab += T(mx, my-2, "+", "middle", 11) + T(mx, my+10, "−", "middle", 11);
          if(t === "meter") lab += T(mx, my+5, (e.text || "V").slice(0,2), "middle", 14);
          const isSrc = ["ac","dc","vsrc","isrc"].includes(t);
          if(e.label){ const s = sidePt(mx,my,ux,uy, hw>=13 ? 24 : 18, isSrc ? !e.flip : e.flip); lab += T(s.x,s.y,e.label,s.anchor); ext(s.x,s.y); }
        }
      } else if(t === "dot"){
        continue;
      } else if(t === "terminal"){
        const [x,y] = P(e.at); g = `<circle class="term" cx="${f1(x)}" cy="${f1(y)}" r="4"/>`; ext(x,y);
        if(e.text){ const pos = e.pos || "right";
          const o = pos==="left" ? [x-12,y+4,"end"] : pos==="above" ? [x,y-12,"middle"] : pos==="below" ? [x,y+22,"middle"] : [x+12,y+4,"start"];
          lab = T(o[0],o[1],e.text,o[2]); ext(o[0] + (o[2]==="start" ? 30 : o[2]==="end" ? -30 : 0), o[1]); }
      } else if(t === "label"){
        const [x,y] = P(e.at); lab = T(x, y+4, e.text ?? e.label ?? "", e.anchor || "middle"); ext(x,y);
      } else if(t === "gnd"){

  t = t.replace(/\\\[([\s\S]+?)\\\]/g, (m,b)=>{ dm.push(b); return `⟦D${dm.length-1}⟧`; });
  t = t.replace(/\\\((.+?)\\\)/g, (m,b)=>{ im.push(b); return `⟦M${im.length-1}⟧`; });
  t = t.replace(/\$([^\s$](?:[^$\n]*?[^\s$\\])?)\$/g, (m,b)=>{ im.push(b); return `⟦M${im.length-1}⟧`; });
  t = t.replace(/⟦C(\d+)⟧/g, (m,i)=>codes[+i]);

  let html = DOMPurify.sanitize(marked.parse(t, { gfm:true, breaks:false }));
  html = html.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  html = html.replace(/<p>\s*⟦S(\d+)⟧\s*<\/p>/g, (m,i)=>figure(svgs[+i], streaming)).replace(/⟦S(\d+)⟧/g, (m,i)=>figure(svgs[+i], streaming));
  html = html.replace(/<p>\s*⟦P⟧\s*<\/p>|⟦P⟧/g, '<div class="pending">Drawing diagram…</div>');
  html = html.replace(/<p>\s*⟦D(\d+)⟧\s*<\/p>/g, (m,i)=>`<div class="eq">\\[${esc(dm[+i])}\\]</div>`)
             .replace(/⟦D(\d+)⟧/g, (m,i)=>`<span class="eq">\\[${esc(dm[+i])}\\]</span>`)
             .replace(/⟦M(\d+)⟧/g, (m,i)=>`\\(${esc(im[+i])}\\)`);
  return html;
}

const REQUEST_URL = "";            // optional: a Google Form link where students request topics or report mistakes

const MODES = [["short","Short","संक्षिप्त"],["full","Full","पूर्ण"],["detailed","Detailed","विस्तृत"]];
const modeName = m => (MODES.find(x => x[0] === m) || MODES[1])[1];

/* note-length modes and model answers:
   :::short ... :::   quick revision (shown only in Short)
   :::detail ... :::  in-depth material (shown only in Detailed)
   :::q short|long  question  ---  answer  :::   collapsible model answer (all modes) */
function applyMode(text, mode){
  const blocks = { short: [], detail: [] };
  let t = text.replace(/^:::(short|detail)[ \t]*\n([\s\S]*?)\n:::[ \t]*$/gm, (m, k, body) => { blocks[k].push(body); return `\u0001${k}${blocks[k].length-1}\u0001`; });
  const qaAt = t.search(/^## [^\n]*\(Questions with Answers\)/m);
  const qa = qaAt >= 0 ? t.slice(qaAt) : "";
  if(mode === "short" && blocks.short.length) t = blocks.short.join("\n\n") + (qa ? "\n\n" + qa : "");
  else t = t.replace(/\u0001(short|detail)(\d+)\u0001/g, (m, k, i) => k === "detail" && mode === "detailed" ? `<div class="deep">\n\n${blocks.detail[+i]}\n\n</div>` : "");
  t = t.replace(/\u0001(short|detail)(\d+)\u0001/g, "");
  return t.replace(/^:::q[ \t]+(short|long)[ \t]*\n([\s\S]*?)\n---[ \t]*\n([\s\S]*?)\n:::[ \t]*$/gm, (m, k, q, ans) =>
    `<details class="qa qa-${k}">\n<summary><span class="qbadge">${k === "short" ? "Short answer" : "Long answer"}</span><span class="qtext">${escH(q.trim())}</span></summary>\n\n${ans}\n\n</details>`);
}
function buildSeg(box, onChange){
  box.innerHTML = "";
  MODES.forEach(([k, en, hi]) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", k === S.mode ? "true" : "false");
    b.innerHTML = `<span>${en}</span><small>${hi}</small>`;
    b.onclick = () => { if(S.mode === k) return; S.mode = k; try{ localStorage.setItem("mode", k); }catch(e){} document.querySelectorAll("[data-seg]").forEach(x => buildSeg(x, onChange)); onChange && onChange(); };
    box.append(b);
  });
}

/* ---------- search ---------- */
function doSearch(){
  const q = ($("search").value || "").trim().toLowerCase(); const out = $("results");
  if(q.length < 2){ out.hidden = true; $("subjects").hidden = false; $("semtabs").hidden = false; return; }
  const words = q.split(/\s+/);
  const hits = S.flat.filter(x => { const s = `${x.t.t} ${x.t.h||""} ${x.sub.name} ${x.sub.code} ${x.u.name}`.toLowerCase(); return words.every(w => s.includes(w)); })
    .sort((a,b) => (b.t.ready?1:0) - (a.t.ready?1:0)).slice(0, 40);
  out.hidden = false; $("subjects").hidden = true; $("semtabs").hidden = true;
  out.innerHTML = hits.length ? "" : `<p class="empty">No topic matches “${escH(q)}”. Try another word, e.g. rectifier, zener, flip-flop.</p>`;
  hits.forEach(x => {
    const el = document.createElement(x.t.ready ? "a" : "div"); el.className = "hit" + (x.t.ready ? "" : " na");
    if(x.t.ready) el.href = "#t-" + x.t.id;
    el.innerHTML = `<span class="hs">${x.sem.name} · ${x.sub.code} ${escH(x.sub.name)} · Unit ${x.u.n}</span><span class="ht"></span><span class="chip${x.t.ready ? " ok" : ""}">${x.t.ready ? "Read" : "Coming soon"}</span>`;
    el.querySelector(".ht").textContent = x.t.t + (x.t.h ? " · " + x.t.h : "");
    out.append(el);
  });
}

const PDF_LIBS = [
  ["html2canvas", ["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"]],
  ["jspdf", ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"]]
];
const PDF_W = 688, PAGE_MM = { w:210, h:297, side:14, top:14, bottom:16 };
const PAGE_H = Math.floor((PAGE_MM.h - PAGE_MM.top - PAGE_MM.bottom) * PDF_W / (PAGE_MM.w - 2*PAGE_MM.side));
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => { el.remove(); rej(new Error(src)); }; document.head.appendChild(el); }); }
let libsReady = null;
function loadPdfLibs(){
  if(!libsReady) libsReady = (async () => { for(const [g, urls] of PDF_LIBS){ if(window[g]) continue; let ok = false; for(const u of urls){ try{ await loadScript(u); ok = true; break; }catch(e){} } if(!ok) throw new Error("lib"); } })().catch(e => { libsReady = null; throw e; });
  return libsReady;
}
function fixSvgsForPdf(body){
  body.querySelectorAll(".fig-warn, .pending, .thinking, .qa-tools").forEach(n => n.remove());
  body.querySelectorAll("details").forEach(d => d.setAttribute("open", ""));
  body.querySelectorAll("mjx-assistive-mml").forEach(n => n.remove());
  body.querySelectorAll(".fig svg").forEach(svg => {
    const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
    if(vb.length === 4 && vb[2] > 0){
      const w = Math.round(Math.min(560, vb[2] * 1.1, (parseFloat(svg.style.maxWidth) || 9999))), h = Math.round(w * vb[3] / vb[2]);
      svg.setAttribute("width", w); svg.setAttribute("height", h); svg.style.cssText = `width:${w}px;height:${h}px;max-width:100%;display:inline-block`;
    } else svg.removeAttribute("style");
    svg.setAttribute("color", "#172033"); svg.setAttribute("font-family", "Helvetica, Arial, sans-serif");
    svg.querySelectorAll(".hl").forEach(n => n.setAttribute("stroke", "#c0392b"));
    svg.querySelectorAll('.hl [fill="currentColor"], [fill="currentColor"].hl').forEach(n => n.setAttribute("fill", "#c0392b"));
    svg.querySelectorAll(".hl text").forEach(n => n.setAttribute("fill", "#172033"));
    svg.querySelectorAll(".term").forEach(n => n.setAttribute("fill", "#ffffff"));
    svg.querySelectorAll(".grid").forEach(n => { n.setAttribute("stroke", "#5b667a"); n.setAttribute("stroke-opacity", "0.5"); });
  });
  body.querySelectorAll("mjx-container svg").forEach(svg => svg.setAttribute("color", "#172033"));

function pdfDoc(f, html){
  const root = document.createElement("div"); root.className = "pdfdoc";
  root.innerHTML = `<div class="pdf-head"><div class="pdf-meta"></div><div class="pdf-title"></div>${f.t.h ? `<div class="pdf-hsub"></div>` : ""}</div><div class="md pdf-body"></div><div class="pdf-end">E&amp;TC हिंदी नोट्स · ${escH(S.lib.university)} · ${escH(S.lib.branch)} · Check against your textbook before the exam.</div>`;
  root.querySelector(".pdf-meta").textContent = `${f.sem.name} · ${f.sub.code} ${f.sub.name} · Unit ${f.u.n}: ${f.u.name} · ${modeName(S.mode)} notes`;

  const body = root.querySelector(".pdf-body"); body.innerHTML = html; fixSvgsForPdf(body);
  return root;

function paginate(root){
  const sel = ".pdf-head, h1, h2, h3, h4, p, li, .fig, div.eq, .tbl, pre, blockquote, hr, .pdf-end";
  const items = [...root.querySelectorAll(sel)].filter(el => !el.parentElement.closest(".fig, .eq, .tbl, pre, p, blockquote, li, .pdf-head"));
  for(const el of items){
    const base = root.getBoundingClientRect().top, r = el.getBoundingClientRect();
    const top = r.top - base, h = r.height; if(h <= 0) continue;
    const pageEnd = (Math.floor(top / PAGE_H) + 1) * PAGE_H;
    const need = /^H[1-4]$/.test(el.tagName) ? Math.min(h + 110, PAGE_H) : h;
    if(top + need > pageEnd - 2 && need <= PAGE_H * 0.92 && top % PAGE_H > 4){
      const sp = document.createElement("div"); sp.className = "pdf-spacer"; sp.style.height = (pageEnd - top) + "px"; el.parentNode.insertBefore(sp, el);
    }
  }
}
async function addDocPages(pdf, root, footer, startPage){
  const holder = document.createElement("div");
  holder.style.cssText = `position:fixed;left:-12000px;top:0;width:${PDF_W}px;pointer-events:none;`;
  holder.appendChild(root); document.body.appendChild(holder);
  try{
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    paginate(root);
    const pages = Math.max(1, Math.ceil(root.getBoundingClientRect().height / PAGE_H));
    root.style.height = (pages * PAGE_H) + "px";
    const scale = Math.max(1, Math.min(2, 30000 / (pages * PAGE_H)));
    const canvas = await html2canvas(root, { scale, backgroundColor:"#ffffff", logging:false, useCORS:true, width:PDF_W, height:pages*PAGE_H, windowWidth:PDF_W+40 });
    const cw = PAGE_MM.w - 2*PAGE_MM.side, ch = PAGE_MM.h - PAGE_MM.top - PAGE_MM.bottom;
    for(let i = 0; i < pages; i++){
      const y0 = Math.round(i * PAGE_H * scale), y1 = Math.min(canvas.height, Math.round((i+1) * PAGE_H * scale));
      const c = document.createElement("canvas"); c.width = canvas.width; c.height = Math.round(PAGE_H * scale);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(canvas, 0, y0, canvas.width, y1 - y0, 0, 0, canvas.width, y1 - y0);
      if(startPage + i > 0) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg", 0.9), "JPEG", PAGE_MM.side, PAGE_MM.top, cw, ch);
      pdf.setFontSize(8); pdf.setTextColor(120, 128, 140);
      pdf.text(footer, PAGE_MM.w/2, PAGE_MM.h - 7, { align:"center" });
    }
    return pages;
  } finally { holder.remove(); }
}
function numberPages(pdf){
  const n = pdf.internal.getNumberOfPages();
  for(let i = 1; i <= n; i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(120, 128, 140); pdf.text(`${i} / ${n}`, PAGE_MM.w - PAGE_MM.side, PAGE_MM.h - 7, { align:"right" }); }
}
async function savePdf(pdf, filename){
  const blob = pdf.output("blob");
  let dl = null;
  if(window.claude && claude.use){ try{ dl = await claude.use("downloads"); }catch(e){} }
  if(dl){
    try{ await dl.save({ filename, data: blob }); }
    catch(e){ if(e && e.code !== "declined") showMsg("The PDF could not be saved here. Open the site in a normal browser to download it.", true); }
  } else pdf.save(filename);
}
const fileBase = s => s.replace(/[\\/:*?"<>|#%{}~&]+/g, "").trim().replace(/\s+/g, "-").slice(0, 70);
async function withBusy(btn, label, fn){
  if(btn.disabled) return; const old = btn.textContent; btn.disabled = true; btn.textContent = label; showMsg("");
  try{ await fn(); }catch(e){ console.error(e); showMsg("The PDF could not be created. Check your internet connection and try again.", true); }
  finally{ btn.disabled = false; btn.textContent = old; }
}
async function topicPdf(){
  const f = S.current; if(!f) return;

async function unitPdf(fs, u, btn){
  await withBusy(btn, "Preparing…", async () => {
    await loadPdfLibs(); if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const pdf = new jspdf.jsPDF({ unit:"mm", format:"a4", orientation:"portrait", compress:true });
    let page = 0; const topics = u.topics.filter(t => t.ready);
    for(const [k, t] of topics.entries()){
      btn.textContent = `Preparing ${k+1}/${topics.length}…`;
      const f = find(t.id); const tmp = document.createElement("div"); tmp.className = "md";
      tmp.style.cssText = `position:fixed;left:-12000px;top:0;width:${PDF_W}px`;
      tmp.innerHTML = renderMd(applyMode(await getNote(t.id), S.mode), false); document.body.appendChild(tmp);
      await typesetEl(tmp); const html = tmp.innerHTML; tmp.remove();
      page += await addDocPages(pdf, pdfDoc(f, html), `E&TC Hindi Notes - ${fs.sub.code} Unit ${u.n}`, page);
    }
    numberPages(pdf);
    await savePdf(pdf, `${fs.sub.code}-Unit-${u.n}-${fileBase(u.name)}${S.mode === "full" ? "" : "-" + S.mode}.pdf`);
  });
}

/* ---------- boot ---------- */
(async () => {
  try{ const s = localStorage.getItem("sem"); if(s) S.sem = s; const m = localStorage.getItem("mode"); if(MODES.some(x => x[0] === m)) S.mode = m; }catch(e){}
  $("search").addEventListener("input", doSearch);
  $("pdfbtn").onclick = topicPdf;
  if(REQUEST_URL){ document.querySelectorAll(".req").forEach(a => { a.href = REQUEST_URL; a.hidden = false; }); }
  try{ await loadLib(); }catch(e){ $("v-home").innerHTML = `<p class="note err">The notes library could not be loaded. Check your internet connection and reload the page.</p>`; return; }
  const total = S.flat.length, ready = S.flat.filter(x => x.t.ready).length;
  $("stat").textContent = `${ready} of ${total} topics ready`;
  window.addEventListener("hashchange", route); route();
})();

})();
</script>
